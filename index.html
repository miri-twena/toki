<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toki - לומדים אנגלית</title>
  <meta name="theme-color" content="#5fa83a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Toki">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- top bar: coins and progress to the prize -->
  <header id="topbar" hidden>
    <button id="homeBtn" class="icon-btn home-btn" title="בית">🏠 <span>בית</span></button>
    <div class="coinbox">
      <span class="coin"></span>
      <b id="coinCount">0</b>
      <div class="prizebar"><div id="prizeFill"></div></div>
      <span id="prizeText" class="prize-text"></span>
    </div>
  </header>

  <main id="app"></main>

  <script src="data.js"></script>
  <script src="sprites.js"></script>
  <script src="game.js"></script>
  <script src="dict.js"></script>
  <script>
    // the installable app: the service worker only works when the game is served from a web address (not from a file)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
